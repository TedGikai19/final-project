    <div class="container">
        <h1>Contact Us</h1>
        <p class="description">We'd love to hear from you! Reach out using the form below.</p>
    
        <form action="#" method="POST">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>
    
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
    
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject">
    
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
    
          <button id="btn" type="submit">Send Message</button>
        </form>
    
        <div class="contact-info">
          <p><strong>Phone:</strong> +254 712 345 678</p>
          <p><strong>Email:</strong> info@j-matresort.com</p>
          <p><strong>Location:</strong> J-mat Resort, Kenya</p>
        </div>
      </div>
      <footer>
        &copy; 2025 J-Mat Accasia Resort | Designed by Ted Gikai
        </footer>
